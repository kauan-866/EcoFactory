<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>EcoFactory - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Link do CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  
  <div class="left">
    <h1>EcoFactory </h1>
    <p>
      Sistema web para monitoramento e gestão de processos industriais com foco em produtividade, eficiência e sustentabilidade.
    </p>
  </div>

  <div class="right">
    <div class="login-box">
      <h2>EcoFactory</h2>
      <p>Bem-vindo de volta!</p>

      <form id="loginForm">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="email@exemplo.com" required>
        </div>

        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn">Entrar</button>

        <div class="error" id="errorMsg"></div>
      </form>

      <div class="footer">
        Não tem conta? <a href="cadastro.html">Cadastre-se</a>
      </div>
    </div>
  </div>

</div>

<!-- Link do JS -->
<script src="script.js"></script>

</body>
</html>

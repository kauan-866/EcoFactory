<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>EcoFactory - Cadastro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="cadastro.css">

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="container">

  <div class="left">
    <h1>EcoFactory </h1>
    <p>Crie sua conta e comece a gerenciar sua indústria com inteligência.</p>
  </div>

  <div class="right">
    <div class="form-box">

      <h2>Criar Conta</h2>
      <p>Preencha os dados abaixo</p>

      <form id="registerForm">

        <div class="input-group">
          <i class="fa fa-user"></i>
          <input type="text" id="name" placeholder="Nome completo" required>
        </div>

        <div class="input-group">
          <i class="fa fa-envelope"></i>
          <input type="email" id="email" placeholder="Email" required>
        </div>

        <div class="input-group">
          <i class="fa fa-lock"></i>
          <input type="password" id="password" placeholder="Senha" required>
          <span class="toggle" id="togglePass1"><i class="fa fa-eye"></i></span>
        </div>

        <div class="input-group">
          <i class="fa fa-lock"></i>
          <input type="password" id="confirmPassword" placeholder="Confirmar senha" required>
          <span class="toggle" id="togglePass2"><i class="fa fa-eye"></i></span>
        </div>

        <button type="submit" class="btn" id="registerBtn">
          <span id="btnText">Cadastrar</span>
        </button>

        <div class="error" id="errorMsg"></div>

      </form>

      <div class="footer">
        Já tem conta? <a href="index.html">Entrar</a>
      </div>

    </div>
  </div>

</div>

<script src="cadastro.js"></script>

</body>
</html>
